    function onEditMarketplaceChange() {
        const marketplace = document.getElementById('edit_inv_marketplace').value;
        const selectToko = document.getElementById('edit_inv_toko');
        
        if(!marketplace) {
            selectToko.innerHTML = '<option value="">-- Pilih Toko --</option>';
            selectToko.disabled = true;
            return;
        }
        
        selectToko.disabled = false;
        selectToko.innerHTML = '<option value="">-- Pilih Toko --</option>';
        state.toko.filter(t => t.Marketplace === marketplace).forEach(t => {
            selectToko.innerHTML += `<option value="${t.Nama_Toko}">${t.Nama_Toko}</option>`;
        });
        
        calculateEditInvoice();
    }

    function calculateEditInvoice() {
        const marketplace = document.getElementById('edit_inv_marketplace').value;
        const tokoName = document.getElementById('edit_inv_toko').value;
        const resiCount = parseInt(document.getElementById('edit_inv_jumlah_resi').value) || 0;
        const biayaLain = parseFloat(document.getElementById('edit_inv_biaya_lain').value) || 0;
        
        let totalOmset = 0;
        editInvoiceCart.forEach(item => {
            totalOmset += (item.Qty * item.Harga_Jual_Aktual);
        });
        
        // Biaya Pelayanan (From Settings)
        const tarifPelayanan = 1250; 
        const biayaPelayanan = resiCount * tarifPelayanan;
        document.getElementById('edit_inv_biaya_pelayanan').value = biayaPelayanan;
        
        let feeAdmin = 0;
        let feeEcommerce = 0;
        let feeOngkir = 0;
        let feePromoExtra = 0;
        
        const feeContainer = document.getElementById('edit_inv_online_fees_container');
        
        if(marketplace !== 'Offline' && tokoName) {
            const toko = state.toko.find(t => t.Nama_Toko === tokoName && t.Marketplace === marketplace);
            if(toko) {
                feeEcommerce = totalOmset * (parseFloat(toko.Fee_Ecommerce_Pct) || 0);
                feeOngkir = Math.min(totalOmset * (parseFloat(toko.Fee_GratisOngkir_Pct) || 0), parseFloat(toko.Max_GratisOngkir) || 999999);
                feePromoExtra = Math.min(totalOmset * (parseFloat(toko.Fee_Promo_Pct) || 0), parseFloat(toko.Max_Promo) || 999999);
                
                feeAdmin = feeEcommerce + feeOngkir + feePromoExtra;
                
                feeContainer.classList.remove('hidden');
                document.getElementById('edit_inv_summary_fee_ecommerce').textContent = '- Rp ' + feeEcommerce.toLocaleString('id-ID');
                document.getElementById('edit_inv_summary_fee_ongkir').textContent = '- Rp ' + feeOngkir.toLocaleString('id-ID');
                document.getElementById('edit_inv_summary_fee_promo_extra').textContent = '- Rp ' + feePromoExtra.toLocaleString('id-ID');
            }
        } else {
            feeContainer.classList.add('hidden');
        }
        
        document.getElementById('edit_inv_summary_omset').textContent = 'Rp ' + totalOmset.toLocaleString('id-ID');
        
        return {
            totalOmset,
            feeAdmin,
            biayaPelayanan,
            biayaLain
        };
    }

    function saveEditInvoice(e) {
        if(e) e.preventDefault();
        
        const safeCart = editInvoiceCart || [];
        if(safeCart.length === 0) {
            Swal.fire('Peringatan', 'Keranjang belanja kosong!', 'warning');
            return;
        }
        
        const btn = document.getElementById('btnSaveEditInvoice');
        if(btn) {
            btn.disabled = true;
            btn.innerHTML = '<i data-lucide="loader-2" class="w-4 h-4 animate-spin"></i> Menyimpan...';
            lucide.createIcons();
        }
        
        const calc = calculateEditInvoice();
        
        const invoiceData = {
            header: {
                Tanggal: document.getElementById('edit_inv_tanggal').value,
                Shift: document.getElementById('edit_inv_shift').value,
                Tipe: document.getElementById('edit_inv_marketplace').value === 'Offline' ? 'Offline' : 'Online',
                Marketplace: document.getElementById('edit_inv_marketplace').value,
                Nama_Toko: document.getElementById('edit_inv_toko').value,
                Total_Fee_Admin: calc.feeAdmin,
                Biaya_Pelayanan: calc.biayaPelayanan,
                Biaya_Lain: calc.biayaLain
            },
            details: safeCart
        };

        showLoading(true);
        google.script.run
            .withFailureHandler(err => {
                showLoading(false);
                if(btn) {
                    btn.disabled = false;
                    btn.innerHTML = '<i data-lucide="save" class="w-4 h-4"></i> Simpan Perubahan';
                    lucide.createIcons();
                }
                Swal.fire('Gagal!', 'Terjadi kesalahan: ' + err.message, 'error');
            })
            .withSuccessHandler(res => {
                showLoading(false);
                if(res.success) {
                    Swal.fire({
                        title: 'Berhasil!',
                        text: 'Transaksi ' + res.noInvoice + ' berhasil diperbarui.',
                        icon: 'success',
                        confirmButtonColor: '#0f172a'
                    }).then(() => {
                        const modalEl = document.getElementById('modalEditInvoice');
                        const modal = bootstrap.Modal.getInstance(modalEl);
                        if(modal) modal.hide();
                        loadInitialData();
                    });
                } else {
                    Swal.fire('Gagal!', res.message || 'Gagal memperbarui transaksi.', 'error');
                }
                if(btn) {
                    btn.disabled = false;
                    btn.innerHTML = '<i data-lucide="save" class="w-4 h-4"></i> Simpan Perubahan';
                    lucide.createIcons();
                }
            }).updateSalesData(currentEditInvoiceId, invoiceData);

    function editInvoice(noInvoice) {
        if(!confirm('Untuk mengedit, Anda akan diarahkan ke form invoice. Data lama akan dihapus saat Anda menyimpan revisi. Lanjutkan?')) return;
        
        showLoading(true);
        google.script.run
            .withFailureHandler(err => {
                showLoading(false);
                Swal.fire('Error', 'Gagal mengambil detail invoice: ' + err, 'error');
            })
            .withSuccessHandler(details => {
                showLoading(false);
                const header = state.invoices.find(h => h.No_Invoice === noInvoice);
                if(!header) return;
                
                // Switch to Invoice view
                showPage('invoice');
                
                // Fill header
                document.getElementById('inv_tanggal').value = header.Tanggal;
                document.getElementById('inv_marketplace').value = header.Marketplace;
                onMarketplaceChange(); // populate toko
                setTimeout(() => {
                    document.getElementById('inv_toko').value = header.Nama_Toko;
                    document.getElementById('inv_shift').value = header.Shift || '09:00';
                    document.getElementById('inv_jumlah_resi').value = header.Biaya_Pelayanan / 1250; // assuming default fee
                    document.getElementById('inv_biaya_lain').value = header.Biaya_Lain;
                    
                    // Fill items
                    invoiceItems = details.map(d => ({
                        ID_Produk: d.ID_Produk,
                        Qty: d.Qty,
                        Harga_Jual_Aktual: d.Harga_Jual_Aktual
                    }));
                    
                    // Mark as editing
                    window.editingNoInvoice = noInvoice;
                    
                    renderInvoiceItems();
                    calculateInvoice();
                }, 500);
            })
            .getInvoiceDetails(noInvoice);
    }

    function filterInventorySummary() {
        try {
            const query = (document.getElementById('filter-inventory-summary').value || '').toLowerCase().trim();
            const tbody = document.getElementById('tbody-inventory-summary');
            if (!tbody) return;
            tbody.innerHTML = '';
            
            const safeData = state.inventorySummary || [];
            let filtered = safeData;
            if (query) {
                filtered = filtered.filter(s => {
                    const text = `${s.ID_Produk} ${s.Nama_Produk}`.toLowerCase();
                    return text.includes(query);
                });
            }
            
            const startIdx = (inventorySummaryState.currentPage - 1) * inventorySummaryState.itemsPerPage;
            const endIdx = startIdx + inventorySummaryState.itemsPerPage;
            const slicedData = filtered.slice(startIdx, endIdx);
            
            if (slicedData.length === 0) {
                tbody.innerHTML = '<tr><td colspan="5" class="px-4 py-6 text-center text-slate-400">Tidak ada data ditemukan</td></tr>';
            } else {
                slicedData.forEach(s => {

                    tbody.innerHTML += `
                        <tr>
                            <td class="px-4 py-3">${s.ID_Produk}</td>
                            <td class="px-4 py-3 font-medium text-slate-900 dark:text-slate-100">${s.Nama_Produk}</td>

                            <td class="px-4 py-3"><span class="px-2.5 py-1 bg-slate-900 dark:bg-slate-100 text-white dark:text-slate-900 rounded-lg text-xs font-bold">${(s.Total_Stok || 0)}</span></td>
                            <td class="px-4 py-3">Rp ${(s.Nilai_Aset || 0).toLocaleString('id-ID')}</td>
                        </tr>
                    `;
                });
            }
            
            // Update Pagination
            const totalRows = filtered.length;
            const totalPages = Math.ceil(totalRows / inventorySummaryState.itemsPerPage) || 1;
            const displayStart = totalRows === 0 ? 0 : startIdx + 1;
            const displayEnd = Math.min(endIdx, totalRows);
            
            const paginationContainer = document.getElementById('pagination-inventory-summary');
            if(paginationContainer) {
                paginationContainer.innerHTML = `
                    <span>Menampilkan ${displayStart}-${displayEnd} dari ${totalRows} baris</span>

                    </div>
                `;
            }
            lucide.createIcons();
        } catch(e) {
            console.error('Filter Inventory Error:', e);
        }

            const totalPages = Math.ceil(totalRows / inboundStokState.itemsPerPage) || 1;
            const displayStart = totalRows === 0 ? 0 : startIdx + 1;
            const displayEnd = Math.min(endIdx, totalRows);
            
            const paginationContainer = document.getElementById('pagination-inbound-stok');
            if(paginationContainer) {
                paginationContainer.innerHTML = `
                    <span>Menampilkan ${displayStart}-${displayEnd} dari ${totalRows} baris</span>
                    <div class="inline-flex rounded-lg border border-slate-200 dark:border-slate-700">
                        <button onclick="changePageInboundStok(-1)" ${inboundStokState.currentPage === 1 ? 'disabled' : ''} class="px-3 py-1.5 text-sm font-medium text-slate-600 dark:text-slate-300 hover:bg-slate-50 dark:hover:bg-slate-700 border-r border-slate-200 dark:border-slate-700 transition-colors rounded-l-lg disabled:opacity-50">Previous</button>
                        <button disabled class="px-3 py-1.5 text-sm font-medium text-slate-900 dark:text-slate-100 bg-slate-50 dark:bg-slate-800/50">${inboundStokState.currentPage}</button>
                        <button onclick="changePageInboundStok(1)" ${inboundStokState.currentPage === totalPages ? 'disabled' : ''} class="px-3 py-1.5 text-sm font-medium text-slate-600 dark:text-slate-300 hover:bg-slate-50 dark:hover:bg-slate-700 border-l border-slate-200 dark:border-slate-700 transition-colors rounded-r-lg disabled:opacity-50">Next</button>
                    </div>
                `;
            }
            lucide.createIcons();
        } catch(e) {
            console.error('Filter Inbound Error:', e);
        }
    }
    // --- MODAL HELPERS ---
    function openModal(id) {
        const modal = document.getElementById(id);
        if (!modal) return;
        modal.classList.remove('hidden');
        setTimeout(() => {
            const overlay = modal.querySelector('.modal-overlay');
            const content = modal.querySelector('.modal-content');
            if(overlay) overlay.classList.replace('opacity-0', 'opacity-100');
            if(content) {
                content.classList.replace('scale-95', 'scale-100');
                content.classList.replace('opacity-0', 'opacity-100');
            }
        }, 10);
        if(typeof lucide !== 'undefined') lucide.createIcons();
    }

    function closeModal(id) {
        const modal = document.getElementById(id);
        if (!modal) return;
        const overlay = modal.querySelector('.modal-overlay');
        const content = modal.querySelector('.modal-content');
        if(overlay) overlay.classList.replace('opacity-100', 'opacity-0');
        if(content) {
            content.classList.replace('scale-100', 'scale-95');
            content.classList.replace('opacity-100', 'opacity-0');
        }
        setTimeout(() => {
            modal.classList.add('hidden');
        }, 200);
    }

    // Modal Global Listener for Close
    document.addEventListener('click', (e) => {
        if (e.target.closest('[data-bs-dismiss="modal"]')) {
            const modal = e.target.closest('.fixed.inset-0');
            if (modal) closeModal(modal.id);
        }
    });

    // --- FINANCE MODAL ACTIONS ---
    function openModalTambahModal() {
        document.getElementById('formTambahModal').reset();
        document.getElementById('modal_tanggal').value = new Date().toISOString().split('T')[0];
        openModal('modalTambahModal');
    }

    function openModalPengeluaran() {
        document.getElementById('formPengeluaran').reset();
        document.getElementById('peng_tanggal').value = new Date().toISOString().split('T')[0];
        openModal('modalPengeluaran');
    }

    function saveTambahModal(e) {
        e.preventDefault();
        const data = {
            Tanggal: document.getElementById('modal_tanggal').value,
            Nominal: document.getElementById('modal_nominal').value,
            Keterangan: document.getElementById('modal_keterangan').value,
            Rekening: document.getElementById('modal_rekening').value
        };
        
        showLoading(true);
        google.script.run
            .withSuccessHandler(res => {
                showLoading(false);
                if(res.success) {
                    showToast('Modal berhasil ditambahkan', 'success');
                    closeModal('modalTambahModal');
                    refreshBankBalances(); // Refresh cards immediately
                    loadInitialData();
                } else {
                    showToast(res.message || 'Gagal menyimpan', 'error');
                }
            })
            .withFailureHandler(err => {
                showLoading(false);
                showToast('Error: ' + err.message, 'error');
            })
            .saveTambahModal(data);
    }

    function savePengeluaran(e) {
        e.preventDefault();
        const data = {
            Tanggal: document.getElementById('peng_tanggal').value,
            Kategori: document.getElementById('peng_kategori').value,
            Nominal: document.getElementById('peng_nominal').value,
            Keterangan: document.getElementById('peng_keterangan').value,
            Rekening: document.getElementById('peng_rekening').value
        };
        
        showLoading(true);
        google.script.run
            .withSuccessHandler(res => {
                showLoading(false);
                if(res.success) {
                    showToast('Pengeluaran berhasil dicatat', 'success');
                    closeModal('modalPengeluaran');
                    refreshBankBalances(); // Refresh cards immediately
                    loadInitialData();
                } else {
                    showToast(res.message || 'Gagal menyimpan', 'error');
                }
            })
            .withFailureHandler(err => {
                showLoading(false);
                showToast('Error: ' + err.message, 'error');
            })
            .savePengeluaran(data);
    }
</script>
