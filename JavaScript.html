<script>
    // --- BOOTSTRAP SHIM FOR TAILWIND MODALS ---
    const bootstrap = {
        Modal: class {
            constructor(element) {
                this.element = element;
                this.overlay = element.querySelector('.modal-overlay');
                this.content = element.querySelector('.modal-content');
            }
            show() {
                this.element.classList.remove('hidden');
                // Small delay for transition
                setTimeout(() => {
                    if(this.overlay) this.overlay.classList.remove('opacity-0');
                    if(this.content) {
                        this.content.classList.remove('opacity-0', 'scale-95');
                        this.content.classList.add('opacity-100', 'scale-100');
                    }
                }, 10);
            }
            hide() {
                if(this.overlay) this.overlay.classList.add('opacity-0');
                if(this.content) {
                    this.content.classList.remove('opacity-100', 'scale-100');
                    this.content.classList.add('opacity-0', 'scale-95');
                }
                setTimeout(() => {
                    this.element.classList.add('hidden');
                }, 200); // match transition duration
            }
            static getInstance(element) {
                return new bootstrap.Modal(element);
            }
        }
    };

    // Global listeners for data-bs-dismiss
    document.addEventListener('click', (e) => {
        if(e.target.closest('[data-bs-dismiss="modal"]')) {
            const modalEl = e.target.closest('.fixed.inset-0');
            if(modalEl) {
                const modal = new bootstrap.Modal(modalEl);
                modal.hide();
            }
        }
    });

    // Global State
    let state = {
        produk: [],
        supplier: [],
        toko: [],
        stok: [],
        inventorySummary: [],
        invoices: [],
        invoiceDetails: [],
        retur: [],
        pengeluaran: [],
        bukuKas: [],
        users: []
    };

    // Pagination States
    let historyState = {
        filtered: [],
        currentPage: 1,
        itemsPerPage: 10,
        sortCol: 'Tanggal',
        sortAsc: false
    };

    let historyDetailState = {
        filtered: [],
        currentPage: 1,
        itemsPerPage: 10,
        sortCol: 'Tanggal',
        sortAsc: false
    };

    let inventorySummaryState = {
        currentPage: 1,
        itemsPerPage: 15
    };

    let inboundStokState = {
        currentPage: 1,
        itemsPerPage: 10
    };

    let returState = {
        currentPage: 1,
        itemsPerPage: 10
    };

    // Initialize App
    document.addEventListener("DOMContentLoaded", () => {
        lucide.createIcons();
        checkSession();
    });

    function checkSession() {
        const session = sessionStorage.getItem('krank_user');
        if (session) {
            // User is logged in
            document.getElementById('loginOverlay').style.display = 'none';
            document.getElementById('sidebar').style.visibility = 'visible';
            document.getElementById('main-content').style.visibility = 'visible';
            setupThemeToggling();
            setupSidebarToggling();
            setupNavigation();
            loadInitialData();
        } else {
            // Show login, hide main UI
            document.getElementById('loginOverlay').style.display = 'flex';
            document.getElementById('sidebar').style.visibility = 'hidden';
            document.getElementById('main-content').style.visibility = 'hidden';
            lucide.createIcons();
        }
    }

    function handleLogin(e) {
        e.preventDefault();
        const username = document.getElementById('login_username').value.trim();
        const password = document.getElementById('login_password').value.trim();
        const errorDiv = document.getElementById('login_error');
        const btn = document.getElementById('btnLogin');
        
        errorDiv.classList.add('hidden');
        btn.disabled = true;
        btn.innerHTML = '<i data-lucide="loader-2" class="w-4 h-4 animate-spin"></i> Memverifikasi...';
        lucide.createIcons();
        
        google.script.run.withSuccessHandler(result => {
            if (result && result.success) {
                sessionStorage.setItem('krank_user', JSON.stringify({ username: result.username, role: result.role }));
                checkSession();
            } else {
                errorDiv.textContent = result.message || 'Login gagal.';
                errorDiv.classList.remove('hidden');
                btn.disabled = false;
                btn.innerHTML = '<i data-lucide="log-in" class="w-4 h-4"></i> Masuk';
                lucide.createIcons();
            }
        }).withFailureHandler(err => {
            errorDiv.textContent = 'Error: ' + err.message;
            errorDiv.classList.remove('hidden');
            btn.disabled = false;
            btn.innerHTML = '<i data-lucide="log-in" class="w-4 h-4"></i> Masuk';
            lucide.createIcons();
        }).verifyLogin(username, password);
    }

    function handleLogout() {
        Swal.fire({
            title: 'Logout',
            text: 'Yakin ingin logout?',
            icon: 'warning',
            showCancelButton: true,
            confirmButtonColor: '#0f172a',
            cancelButtonColor: '#f1f5f9',
            confirmButtonText: 'Ya, Logout',
            cancelButtonText: 'Batal',
            customClass: {
                confirmButton: 'text-white',
                cancelButton: 'text-slate-600'
            }
        }).then((result) => {
            if (result.isConfirmed) {
                showLoading(true);
                sessionStorage.removeItem('krank_user');
                location.reload();
            }
        });
    }

    function loadInitialData() {
        showLoading(true);
        google.script.run
            .withFailureHandler(err => {
                showLoading(false);
                console.error('Connection Error:', err);
                Swal.fire('Koneksi Terputus', 'Gagal mengambil data dari server: ' + err, 'error');
            })
            .withSuccessHandler(data => {
                try {
                    if (!data) throw new Error('Data dari server kosong atau tidak valid.');
                    
                    state = data;
                    state.produk = data.produk || [];
                    state.supplier = data.supplier || [];
                    state.toko = data.toko || [];
                    state.stok = data.stok || [];
                    state.inventorySummary = data.inventorySummary || [];
                    state.invoices = data.invoices || [];
                    state.invoiceDetails = data.invoiceDetails || [];
                    state.retur = data.retur || [];
                    state.pengeluaran = data.pengeluaran || [];
                    state.bukuKas = data.bukuKas || [];
                    state.users = data.users || [];
                    
                    renderMasterProduk();
                    renderMasterToko();
                    renderMasterUser();
                    renderInventorySummary();
                    renderInboundStok();
                    renderFinance();
                    renderPengeluaran();
                    renderRetur();
                    renderMutasiKas();
                    renderSaldoKas();
                    renderStokKrisis();
                    renderReturSummaryCard();
                    applyHistoryFilter();
                    updateDashboardMetrics();
                    populateProductSelects();
                    populateSupplierSelects();
                    refreshBankBalances();
                } catch (e) {
                    console.error('Render Error:', e);
                    Swal.fire('Gagal Render', 'Terjadi kesalahan saat memproses data tampilan: ' + e.message, 'error');
                } finally {
                    showLoading(false);
                }
            }).getInitialData();
    }

    function showLoading(isLoading) {
        const overlay = document.getElementById('loadingOverlay');
        if (!overlay) return;
        
        if (isLoading) {
            overlay.classList.remove('hidden');
            document.body.style.pointerEvents = 'none';
        } else {
            overlay.classList.add('hidden');
            document.body.style.pointerEvents = 'auto';
        }
    }

    // --- LAYOUT & THEME LOGIC ---
    function setupThemeToggling() {
        const themeToggleBtn = document.getElementById('themeToggle');
        const themeIcon = document.getElementById('themeIcon');
        const htmlElement = document.documentElement;

        const savedTheme = localStorage.getItem('krankuindonesia_theme') || 'light';
        setTheme(savedTheme, htmlElement, themeIcon);

        themeToggleBtn.addEventListener('click', () => {
            const currentTheme = htmlElement.classList.contains('dark') ? 'dark' : 'light';
            const newTheme = currentTheme === 'light' ? 'dark' : 'light';
            setTheme(newTheme, htmlElement, themeIcon);
        });
    }

    function setTheme(theme, htmlElement, themeIcon) {
        if (theme === 'dark') {
            htmlElement.classList.add('dark');
            htmlElement.classList.remove('light');
        } else {
            htmlElement.classList.add('light');
            htmlElement.classList.remove('dark');
        }
        localStorage.setItem('krankuindonesia_theme', theme);
        // Replace icon instead of just text content
        const iconName = theme === 'light' ? 'moon' : 'sun';
        const newIcon = document.createElement('i');
        newIcon.setAttribute('data-lucide', iconName);
        newIcon.setAttribute('id', 'themeIcon');
        newIcon.className = 'w-5 h-5';
        themeIcon.parentNode.replaceChild(newIcon, themeIcon);
        lucide.createIcons();
    }

    function switchTab(tabId, group) {
        // Hide all tabs in this group
        const contents = document.querySelectorAll('.tab-content-' + group);
        contents.forEach(el => el.classList.add('hidden'));

        // Reset all buttons in this group
        const buttons = document.querySelectorAll('.tab-btn-' + group);
        buttons.forEach(btn => {
            btn.classList.remove('border-indigo-600', 'text-indigo-600');
            btn.classList.add('border-transparent', 'text-slate-500');
        });

        // Show active tab
        document.getElementById(tabId).classList.remove('hidden');

        // Highlight active button
        const activeBtn = document.querySelector(`.tab-btn-${group}[data-tab="${tabId}"]`);
        if (activeBtn) {
            activeBtn.classList.remove('border-transparent', 'text-slate-500');
            activeBtn.classList.add('border-indigo-600', 'text-indigo-600');
        }
    }

    function setupSidebarToggling() {
        const sidebarToggle = document.getElementById('sidebarToggle');
        const sidebar = document.getElementById('sidebar');
        const overlay = document.getElementById('sidebarOverlay');

        sidebarToggle.addEventListener('click', () => {
            sidebar.classList.toggle('-translate-x-full');
            overlay.classList.toggle('hidden');
        });

        overlay.addEventListener('click', () => {
            sidebar.classList.add('-translate-x-full');
            overlay.classList.add('hidden');
        });
    }

    function setupNavigation() {
        const navLinks = document.querySelectorAll('.nav-link');
        const pageViews = document.querySelectorAll('.page-view');
        const pageTitle = document.getElementById('pageTitle');
        const sidebar = document.getElementById('sidebar');
        const overlay = document.getElementById('sidebarOverlay');

        navLinks.forEach(link => {
            link.addEventListener('click', (e) => {
                e.preventDefault();
                const targetPage = link.getAttribute('data-page');
                
                navLinks.forEach(l => {
                    l.classList.remove('bg-slate-100', 'dark:bg-slate-700', 'text-slate-900', 'dark:text-white');
                    l.classList.add('text-slate-600', 'dark:text-slate-300');
                });
                link.classList.remove('text-slate-600', 'dark:text-slate-300');
                link.classList.add('bg-slate-100', 'dark:bg-slate-700', 'text-slate-900', 'dark:text-white');
                
                pageViews.forEach(view => {
                    if (view.id === 'view-' + targetPage) {
                        view.classList.remove('hidden');
                    } else {
                        view.classList.add('hidden');
                    }
                });
                
                // Dynamic Title Update
                pageTitle.textContent = link.innerText.trim();
                
                if(window.innerWidth <= 768) {
                    sidebar.classList.add('-translate-x-full');
                    overlay.classList.add('hidden');
                }
            });
        });
    }

    // --- RENDER MASTER PRODUK ---

    function renderMasterProduk() {
        try {
            const tbody = document.getElementById('tbody-master-produk');
            if (!tbody) return;
            tbody.innerHTML = '';
            
            const safeData = state.produk || [];
            if (safeData.length === 0) {
                tbody.innerHTML = '<tr><td colspan="4" class="px-4 py-6 text-center text-slate-400">Belum ada data produk</td></tr>';
                return;
            }

            safeData.forEach(p => {
                tbody.innerHTML += `
                    <tr>
                        <td class="px-4 py-3">${p.ID_Produk}</td>
                        <td class="px-4 py-3 font-medium text-slate-900 dark:text-slate-100">${p.Nama_Produk}</td>
                        <td class="px-4 py-3">Rp ${(parseFloat(p.Harga_Jual_Default) || 0).toLocaleString('id-ID')}</td>
                        <td class="px-4 py-3">
                            <div class="flex gap-2">
                                <button class="p-1.5 text-blue-600 hover:bg-blue-50 dark:hover:bg-blue-900/20 rounded-lg transition-colors" onclick="editProduk('${p.ID_Produk}')">
                                    <i data-lucide="edit" class="w-4 h-4"></i>
                                </button>
                                <button class="p-1.5 text-red-600 hover:bg-red-50 dark:hover:bg-red-900/20 rounded-lg transition-colors" onclick="deleteProduk('${p.ID_Produk}')">
                                    <i data-lucide="trash-2" class="w-4 h-4"></i>
                                </button>
                            </div>
                        </td>
                    </tr>
                `;
            });
            lucide.createIcons();
        } catch(e) {
            console.error('Render Produk Error:', e);
        }
    }

    function openModalProduk() {
        document.getElementById('formMasterProduk').reset();
        const inputId = document.getElementById('prd_id');
        inputId.value = '';
        inputId.readOnly = false;
        const modal = new bootstrap.Modal(document.getElementById('modalMasterProduk'));
        modal.show();
    }

    function saveProduk(e) {
        e.preventDefault();
        const btn = document.getElementById('btnSaveProduk');
        if(btn) {
            btn.disabled = true;
            btn.innerHTML = 'Menyimpan...';
        }

        const produk = {
            ID_Produk: document.getElementById('prd_id').value,
            Nama_Produk: document.getElementById('prd_nama').value,
            Harga_Jual_Default: document.getElementById('prd_harga').value
        };

        showLoading(true);
        google.script.run
            .withFailureHandler(err => {
                showLoading(false);
                if(btn) {
                    btn.disabled = false;
                    btn.innerHTML = 'Simpan';
                }
                Swal.fire('Gagal!', 'Gagal menyimpan produk: ' + err.message, 'error');
            })
            .withSuccessHandler(() => {
                showLoading(false);
                const modalEl = document.getElementById('modalMasterProduk');
                const modal = bootstrap.Modal.getInstance(modalEl);
                if(modal) modal.hide();
                
                if(btn) {
                    btn.disabled = false;
                    btn.innerHTML = 'Simpan';
                }
                Swal.fire('Berhasil!', 'Data produk berhasil disimpan.', 'success').then(() => {
                    loadInitialData();
                });
            }).saveMasterProduk(produk);
    }

    function editProduk(id) {
        const p = (state.produk || []).find(x => x.ID_Produk === id);
        if (p) {
            const inputId = document.getElementById('prd_id');
            inputId.value = p.ID_Produk;
            inputId.readOnly = true;
            document.getElementById('prd_nama').value = p.Nama_Produk;
            document.getElementById('prd_harga').value = p.Harga_Jual_Default;
            const modal = new bootstrap.Modal(document.getElementById('modalMasterProduk'));
            modal.show();
        }
    }

    function deleteProduk(id) {
        Swal.fire({
            title: 'Hapus Produk',
            text: `Yakin ingin menghapus produk ${id}?`,
            icon: 'warning',
            showCancelButton: true,
            confirmButtonColor: '#e11d48',
            cancelButtonColor: '#f1f5f9',
            confirmButtonText: 'Hapus',
            cancelButtonText: 'Batal',
            customClass: {
                confirmButton: 'text-white',
                cancelButton: 'text-slate-600'
            }
        }).then((result) => {
            if (result.isConfirmed) {
                showLoading(true);
                google.script.run
                    .withFailureHandler(err => {
                        showLoading(false);
                        Swal.fire('Error', 'Gagal menghapus: ' + err.message, 'error');
                    })
                    .withSuccessHandler(() => {
                        showLoading(false);
                        Swal.fire('Terhapus!', 'Produk berhasil dihapus.', 'success').then(() => {
                            loadInitialData();
                        });
                    }).deleteMasterProduk(id);
            }
        });
    }

    // --- RENDER MASTER TOKO ---

                        <td class="px-4 py-3">Rp ${(parseFloat(t.Max_Promo) || 0).toLocaleString('id-ID')}</td>
                        <td class="px-4 py-3">
                            <div class="flex gap-2">
                                <button class="p-1.5 text-blue-600 hover:bg-blue-50 dark:hover:bg-blue-900/20 rounded-lg transition-colors" onclick="editToko('${t.ID_Toko}')">
                                    <i data-lucide="edit" class="w-4 h-4"></i>
                                </button>
                                <button class="p-1.5 text-red-600 hover:bg-red-50 dark:hover:bg-red-900/20 rounded-lg transition-colors" onclick="deleteToko('${t.ID_Toko}')">

    // --- USER MANAGEMENT ---
    function renderMasterUser() {
        try {
            const tbody = document.getElementById('tbody-master-user');
            if (!tbody) return;
            tbody.innerHTML = '';
            
            const safeData = state.users || [];
            if (safeData.length === 0) {
                tbody.innerHTML = '<tr><td colspan="4" class="px-4 py-6 text-center text-slate-400">Belum ada data user</td></tr>';

            }

                tbody.innerHTML += `

                        <td class="px-4 py-3">

                                </button>
                            </div>
                        </td>
                    </tr>
                `;
            });
            lucide.createIcons();
        } catch(e) {
            console.error('Render User Error:', e);
        }
    }

        e.preventDefault();
        const user = {
            Username: document.getElementById('user_username').value.trim(),
            Password: document.getElementById('user_password').value,
            Role: document.getElementById('user_role').value
        };
        const btn = document.getElementById('btnSaveUser');
        if(btn) {
            btn.disabled = true;
            btn.innerHTML = '<i data-lucide="loader-2" class="w-4 h-4 animate-spin"></i> Menyimpan...';
            lucide.createIcons();
        }

        showLoading(true);
        google.script.run
            .withFailureHandler(err => {
                showLoading(false);
                if(btn) {

            cancelButtonColor: '#f1f5f9',

            customClass: {
                confirmButton: 'text-white',
                cancelButton: 'text-slate-600'
            }
        }).then((result) => {
            if (result.isConfirmed) {
                showLoading(true);
                google.script.run
                    .withFailureHandler(err => {
                        showLoading(false);
                        Swal.fire('Error', 'Gagal: ' + err.message, 'error');
                    })
                    .withSuccessHandler(res => {
                        showLoading(false);
                        Swal.fire('Terhapus!', 'User berhasil dihapus.', 'success').then(() => {
                            loadInitialData();
                        });
                    }).deleteMasterUser(username);

        document.getElementById('toko_id').value = '';
        if(id) {
            const t = (state.toko || []).find(x => x.ID_Toko === id);
            if(t) {
                document.getElementById('toko_id').value = t.ID_Toko;
                document.getElementById('toko_marketplace').value = t.Marketplace;
                document.getElementById('toko_nama').value = t.Nama_Toko;
                document.getElementById('toko_fee_ecom').value = t.Fee_Ecommerce_Pct;
                document.getElementById('toko_fee_ongkir').value = t.Fee_GratisOngkir_Pct;
                document.getElementById('toko_max_ongkir').value = t.Max_GratisOngkir;
                document.getElementById('toko_fee_promo').value = t.Fee_Promo_Pct;
                document.getElementById('toko_max_promo').value = t.Max_Promo;
            }
        }
        const modal = new bootstrap.Modal(document.getElementById('modalMasterToko'));
        modal.show();
    }

    function saveToko(e) {
        e.preventDefault();
        const btn = document.getElementById('btnSaveToko');
        if(btn) {
            btn.disabled = true;
            btn.innerHTML = 'Menyimpan...';
        }

        const toko = {
            ID_Toko: document.getElementById('toko_id').value,
            Marketplace: document.getElementById('toko_marketplace').value,
            Nama_Toko: document.getElementById('toko_nama').value,
            Fee_Ecommerce_Pct: parseFloat(document.getElementById('toko_fee_ecom').value) || 0,
            Fee_GratisOngkir_Pct: parseFloat(document.getElementById('toko_fee_ongkir').value) || 0,
            Max_GratisOngkir: parseFloat(document.getElementById('toko_max_ongkir').value) || 0,
            Fee_Promo_Pct: parseFloat(document.getElementById('toko_fee_promo').value) || 0,
            Max_Promo: parseFloat(document.getElementById('toko_max_promo').value) || 0
        };

        showLoading(true);
        google.script.run
            .withFailureHandler(err => {
                showLoading(false);
                if(btn) {
                    btn.disabled = false;
                    btn.innerHTML = 'Simpan';
                }
                Swal.fire('Gagal!', 'Gagal menyimpan toko: ' + err.message, 'error');
            })
            .withSuccessHandler(() => {
                showLoading(false);
                const modal = bootstrap.Modal.getInstance(document.getElementById('modalMasterToko'));
                if(modal) modal.hide();
                if(btn) {
                    btn.disabled = false;
                    btn.innerHTML = 'Simpan';
                }
                Swal.fire('Berhasil!', 'Data toko berhasil disimpan.', 'success').then(() => {
                    loadInitialData();
                });
            }).saveMasterToko(toko);
    }

    function editToko(id) {

        if (t) {

    // --- RENDER INVENTORY ---
    let productSelectInstances = {};

    function populateProductSelects() {
        try {
            const selects = document.querySelectorAll('select.select-produk');
            const safeProduk = state.produk || [];
            
            selects.forEach(sel => {
                if (!sel || !sel.tagName || sel.tagName !== 'SELECT') return;

                const id = sel.id || 'select-' + Math.random().toString(36).substr(2, 9);
                if (!sel.id) sel.id = id;

                // IMPORTANT: Destroy previous instance if it exists to allow re-initialization on new DOM elements
                if (productSelectInstances[id]) {
                    try {
                        productSelectInstances[id].destroy();
                    } catch(e) { console.error('Error destroying TomSelect:', e); }
                    delete productSelectInstances[id];
                }

                // Populate options if empty
                if (sel.options && sel.options.length <= 1) {
                    const currentVal = sel.value;
                    sel.innerHTML = '<option value="">-- Pilih Produk --</option>';
                    safeProduk.forEach(p => {
                        sel.innerHTML += `<option value="${p.ID_Produk}">${p.ID_Produk} (${p.Nama_Produk})</option>`;
                    });
                    if (currentVal) sel.value = currentVal;
                }

                // Initialize Tom Select
                try {
                    productSelectInstances[id] = new TomSelect('#' + id, {
                        create: false,
                        sortField: { field: "text", direction: "asc" },
                        placeholder: "Cari produk...",
                        allowEmptyOption: true,
                        maxOptions: 1000
                    });
                } catch(e) {
                    console.error('Failed to init TomSelect for ' + id, e);
                }
            });
        } catch(e) {
            console.error('Populate Product Selects Error:', e);
        }
    }

    function populateSupplierSelects() {
        try {
            const selects = document.querySelectorAll('select.select-supplier');
            const safeSupplier = state.supplier || [];
            
            selects.forEach(sel => {
                if (!sel || !sel.tagName || sel.tagName !== 'SELECT') return;

                const id = sel.id || 'select-sup-' + Math.random().toString(36).substr(2, 9);
                if (!sel.id) sel.id = id;

                // Destroy previous instance
                if (productSelectInstances[id]) {
                    try {
                        productSelectInstances[id].destroy();
                    } catch(e) { console.error('Error destroying TomSelect Sup:', e); }
                    delete productSelectInstances[id];
                }

                if (sel.options && sel.options.length <= 1) {
                    const currentVal = sel.value;
                    sel.innerHTML = '<option value="">-- Pilih Supplier --</option>';

                        sel.innerHTML += `<option value="${s.Nama}">${s.Nama}</option>`;

    function changePageInventorySummary(delta) {
        const safeData = state.inventorySummary || [];
        const totalPages = Math.ceil(safeData.length / inventorySummaryState.itemsPerPage) || 1;
        inventorySummaryState.currentPage += delta;
        if (inventorySummaryState.currentPage < 1) inventorySummaryState.currentPage = 1;
        if (inventorySummaryState.currentPage > totalPages) inventorySummaryState.currentPage = totalPages;
        renderInventorySummary();
    }

    function renderInventorySummary() {
        try {
            const tbody = document.getElementById('tbody-inventory-summary');
            if (!tbody) return;
            tbody.innerHTML = '';
            
            const safeData = state.inventorySummary || [];
            if (safeData.length === 0) {
                tbody.innerHTML = '<tr><td colspan="5" class="px-4 py-6 text-center text-slate-400">Belum ada data inventori</td></tr>';
                const elTotalQty = document.getElementById('inv-total-qty');
                if(elTotalQty) elTotalQty.textContent = '0';
                const elTotalValuasi = document.getElementById('inv-total-valuasi');
                if(elTotalValuasi) elTotalValuasi.textContent = '0';
                
                // Still update pagination to show empty state
                const paginationContainer = document.getElementById('pagination-inventory-summary');
                if(paginationContainer) paginationContainer.innerHTML = '';
                return;
            }

            const startIdx = (inventorySummaryState.currentPage - 1) * inventorySummaryState.itemsPerPage;
            const endIdx = startIdx + inventorySummaryState.itemsPerPage;
            const slicedData = safeData.slice(startIdx, endIdx);
            
            let totalQtyOverall = 0;
            let totalValOverall = 0;
            
            safeData.forEach(s => {
                totalQtyOverall += (parseFloat(s.Total_Stok) || 0);
                totalValOverall += (parseFloat(s.Total_Nilai_Aset) || 0);
            });

            slicedData.forEach(s => {
                tbody.innerHTML += `
                    <tr>
                        <td class="px-4 py-3 font-mono text-xs text-slate-500">${s.ID_Produk}</td>
                        <td class="px-4 py-3 font-medium text-slate-900 dark:text-slate-100">${s.Nama_Produk}</td>
                        <td class="px-4 py-3">Rp ${(parseFloat(s.Harga_Jual_Default) || 0).toLocaleString('id-ID')}</td>
                        <td class="px-4 py-3">
                            <span class="px-2 py-1 bg-slate-100 dark:bg-slate-700 rounded font-bold">${(parseFloat(s.Total_Stok) || 0)}</span>
                        </td>
                        <td class="px-4 py-3 font-bold text-indigo-600 dark:text-indigo-400">Rp ${(parseFloat(s.Total_Nilai_Aset) || 0).toLocaleString('id-ID')}</td>
                    </tr>
                `;
            });

            // Summary metrics
            const elTotalQty = document.getElementById('inv-total-qty');
            if(elTotalQty) elTotalQty.textContent = totalQtyOverall.toLocaleString('id-ID');
            const elTotalValuasi = document.getElementById('inv-total-valuasi');
            if(elTotalValuasi) elTotalValuasi.textContent = `Rp ${totalValOverall.toLocaleString('id-ID')}`;

            // Pagination UI
            const totalRows = safeData.length;
            const totalPages = Math.ceil(totalRows / inventorySummaryState.itemsPerPage) || 1;
            const displayStart = totalRows === 0 ? 0 : startIdx + 1;
            const displayEnd = Math.min(endIdx, totalRows);
            
            const paginationContainer = document.getElementById('pagination-inventory-summary');
            if(paginationContainer) {
                paginationContainer.innerHTML = `
                    <span>Menampilkan ${displayStart}-${displayEnd} dari ${totalRows} baris</span>
                    <div class="inline-flex rounded-lg border border-slate-200 dark:border-slate-700">
                        <button onclick="changePageInventorySummary(-1)" ${inventorySummaryState.currentPage === 1 ? 'disabled' : ''} class="px-3 py-1.5 text-sm font-medium text-slate-600 dark:text-slate-300 hover:bg-slate-50 dark:hover:bg-slate-700 border-r border-slate-200 dark:border-slate-700 transition-colors rounded-l-lg disabled:opacity-50">Previous</button>
                        <button disabled class="px-3 py-1.5 text-sm font-medium text-slate-900 dark:text-slate-100 bg-slate-50 dark:bg-slate-800/50">${inventorySummaryState.currentPage}</button>
                        <button onclick="changePageInventorySummary(1)" ${inventorySummaryState.currentPage === totalPages ? 'disabled' : ''} class="px-3 py-1.5 text-sm font-medium text-slate-600 dark:text-slate-300 hover:bg-slate-50 dark:hover:bg-slate-700 border-l border-slate-200 dark:border-slate-700 transition-colors rounded-r-lg disabled:opacity-50">Next</button>
                    </div>
                `;
            }
        } catch(e) {
            console.error('Render Inventory Summary Error:', e);
        }

    // --- INBOUND CART SYSTEM ---
    let inboundCart = [];

    function calculateInboundCartNetPrice() {
        const hargaKotor = parseFloat(document.getElementById('inb_cart_harga_kotor').value) || 0;
        const diskon = parseFloat(document.getElementById('inb_cart_diskon').value) || 0;
        const hargaBersih = hargaKotor - (hargaKotor * (diskon / 100));
        document.getElementById('inb_cart_harga_bersih').value = hargaBersih > 0 ? hargaBersih.toFixed(0) : 0;
    }

    function openModalInbound() {
        inboundCart = [];
        // Set today's date
        const d = new Date();
        const pad = n => String(n).padStart(2, '0');
        document.getElementById('inb_tanggal').value = `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
        document.getElementById('inb_inv_supplier').value = '';
        // Reset cart input fields
        const cartProduk = document.getElementById('inb_cart_produk');
        if (cartProduk) cartProduk.selectedIndex = 0;
        document.getElementById('inb_cart_qty').value = 1;
        document.getElementById('inb_cart_harga_kotor').value = 0;
        document.getElementById('inb_cart_diskon').value = 0;
        document.getElementById('inb_cart_harga_bersih').value = '';
        renderInboundCart();
        populateProductSelects();
        populateSupplierSelects();
        const modal = new bootstrap.Modal(document.getElementById('modalInbound'));
        modal.show();
    }

    function addInboundCartItem() {
        const produkSelect = document.getElementById('inb_cart_produk');
        const idProduk = produkSelect.value;
        if (!idProduk) { alert('Pilih produk terlebih dahulu!'); return; }
        const qty = parseInt(document.getElementById('inb_cart_qty').value) || 0;
        if (qty <= 0) { alert('Qty harus lebih dari 0!'); return; }
        const hargaKotor = parseFloat(document.getElementById('inb_cart_harga_kotor').value) || 0;
        const diskon = parseFloat(document.getElementById('inb_cart_diskon').value) || 0;
        const hargaBersih = parseFloat(document.getElementById('inb_cart_harga_bersih').value) || 0;
        
        const p = state.produk.find(x => x.ID_Produk === idProduk);
        const namaProduk = p ? p.Nama_Produk : idProduk;
        
        inboundCart.push({
            ID_Produk: idProduk,
            Nama_Produk: namaProduk,
            Qty_Masuk: qty,
            Harga_Beli_Kotor: hargaKotor,
            Diskon_Supplier: diskon,
            Harga_Beli_Bersih: hargaBersih
        });
        
        // Reset input fields for next item
        produkSelect.selectedIndex = 0;
        document.getElementById('inb_cart_qty').value = 1;
        document.getElementById('inb_cart_harga_kotor').value = 0;
        document.getElementById('inb_cart_diskon').value = 0;
        document.getElementById('inb_cart_harga_bersih').value = '';
        
        renderInboundCart();
    }

    function removeInboundCartItem(index) {
        inboundCart.splice(index, 1);
        renderInboundCart();
    }

    function renderInboundCart() {
        const tbody = document.getElementById('inbound-cart-items');
        if (!tbody) return;
        
        if (inboundCart.length === 0) {
            tbody.innerHTML = '<tr><td colspan="8" class="text-center text-slate-400 py-6">Belum ada item ditambahkan</td></tr>';
            document.getElementById('inb_cart_total_items').textContent = '0';
            document.getElementById('inb_cart_total_value').textContent = 'Rp 0';
            return;
        }
        
        let totalValue = 0;
        tbody.innerHTML = '';
        inboundCart.forEach((item, index) => {
            const subtotal = item.Qty_Masuk * item.Harga_Beli_Bersih;
            totalValue += subtotal;
            tbody.innerHTML += `
                <tr>
                    <td class="px-4 py-3 text-slate-500">${index + 1}</td>
                    <td class="px-4 py-3 font-medium text-slate-900 dark:text-slate-100">${item.Nama_Produk}</td>
                    <td class="px-4 py-3">${item.Qty_Masuk}</td>
                    <td class="px-4 py-3">Rp ${item.Harga_Beli_Kotor.toLocaleString('id-ID')}</td>
                    <td class="px-4 py-3">${item.Diskon_Supplier}%</td>
                    <td class="px-4 py-3">Rp ${item.Harga_Beli_Bersih.toLocaleString('id-ID')}</td>
                    <td class="px-4 py-3 font-medium">Rp ${subtotal.toLocaleString('id-ID')}</td>
                    <td class="px-4 py-3">
                        <button type="button" class="p-1.5 text-red-500 hover:bg-red-50 dark:hover:bg-red-900/20 rounded transition-colors" onclick="removeInboundCartItem(${index})">
                            <i data-lucide="trash-2" class="w-4 h-4"></i>
                        </button>
                    </td>
                </tr>
            `;
        });
        
        document.getElementById('inb_cart_total_items').textContent = inboundCart.length;
        document.getElementById('inb_cart_total_value').textContent = 'Rp ' + totalValue.toLocaleString('id-ID');
        lucide.createIcons();
    }

        if (inboundCart.length === 0) {
            alert('Tambahkan minimal 1 item ke keranjang!');

        }
        const tanggal = document.getElementById('inb_tanggal').value;

    function editInbound(idBatch) {
        const s = state.stok.find(x => x.ID_Batch === idBatch);
        if (s) {
            // For editing, we delete the old batch and let user re-enter via cart
            Swal.fire({
                title: 'Edit Inbound',
                text: 'Untuk mengedit, data lama akan dihapus dan Anda bisa memasukkan ulang via keranjang. Lanjutkan?',
                icon: 'question',
                showCancelButton: true,
                confirmButtonColor: '#0f172a',
                cancelButtonColor: '#f1f5f9',
                confirmButtonText: 'Lanjutkan',
                cancelButtonText: 'Batal',
                customClass: { confirmButton: 'text-white', cancelButton: 'text-slate-600' }
            }).then((result) => {
                if (result.isConfirmed) {
                    showLoading(true);
                    google.script.run
                        .withFailureHandler(err => {
                            showLoading(false);
                            Swal.fire('Error', 'Gagal menghapus data lama: ' + err, 'error');
                        })
                        .withSuccessHandler((success) => {
                            if (success) {
                                loadInitialData();
                                setTimeout(() => {
                                    openModalInbound();
                                    document.getElementById('inb_tanggal').value = s.Tanggal;
                                    document.getElementById('inb_inv_supplier').value = s.No_Invoice_Supplier || '';
                                    const supplierSel = document.getElementById('inb_supplier');
                                    if (supplierSel) {
                                        for (let i = 0; i < supplierSel.options.length; i++) {
                                            if (supplierSel.options[i].value === (s.Nama_Supplier || '')) {
                                                supplierSel.selectedIndex = i;
                                                break;
                                            }

                                    }];

                                }, 500);
                            } else {

    function applyDashboardFilter() {

    function updateDashboardMetrics() {
        try {
            const today = new Date().toISOString().split('T')[0];
            const safeInvoices = state.invoices || [];
            const safePengeluaran = state.pengeluaran || [];
            const safeRetur = state.retur || [];
            const safeInventory = state.inventorySummary || [];
            
            // Omset Hari Ini
            const todayInvoices = safeInvoices.filter(inv => inv.Tanggal === today);
            const todayOmset = todayInvoices.reduce((sum, inv) => sum + (parseFloat(inv.Total_Omset) || 0), 0);
            const elOmset = document.getElementById('metric-omset-today');
            if(elOmset) elOmset.textContent = `Rp ${todayOmset.toLocaleString('id-ID')}`;
            
            // Laba Bersih Hari Ini
            const todayLaba = todayInvoices.reduce((sum, inv) => sum + (parseFloat(inv.Laba_Bersih) || 0), 0);
            const elLaba = document.getElementById('metric-laba-today');
            if(elLaba) elLaba.textContent = `Rp ${todayLaba.toLocaleString('id-ID')}`;
            
            // Pengeluaran Hari Ini
            const todayExp = safePengeluaran.filter(exp => exp.Tanggal === today);
            const todayTotalExp = todayExp.reduce((sum, exp) => sum + (parseFloat(exp.Nominal) || 0), 0);
            const elExp = document.getElementById('metric-exp-today');
            if(elExp) elExp.textContent = `Rp ${todayTotalExp.toLocaleString('id-ID')}`;
            
            // Stok Rendah Count
            const lowStockCount = safeInventory.filter(s => (parseFloat(s.Total_Stok) || 0) <= 5).length;
            const elLow = document.getElementById('metric-low-stock');
            if(elLow) elLow.textContent = lowStockCount;
        } catch(e) {
            console.error('Update Dashboard Metrics Error:', e);
        }
    }

    function renderDashboardChart(filteredInvoices) {
        try {
            const ctx = document.getElementById('chartTrenPenjualan');
            if (!ctx) return;

            const safeInvoices = filteredInvoices || [];

            // Group by Date
            const grouped = {};
            safeInvoices.forEach(inv => {
                if (!grouped[inv.Tanggal]) grouped[inv.Tanggal] = 0;
                grouped[inv.Tanggal] += parseFloat(inv.Total_Omset) || 0;
            });

            // Sort keys
            const labels = Object.keys(grouped).sort();
            const data = labels.map(l => grouped[l]);

            if (dashChartInstance) {
                dashChartInstance.destroy();
            }

            dashChartInstance = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: labels.length > 0 ? labels : ['Belum ada data'],
                    datasets: [{
                        label: 'Omset Penjualan (Rp)',
                        data: data.length > 0 ? data : [0],
                        borderColor: '#0f172a',
                        backgroundColor: 'rgba(15, 23, 42, 0.05)',
                        borderWidth: 2,
                        fill: true,
                        tension: 0.3,
                        pointBackgroundColor: '#0f172a',
                        pointRadius: 4
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: { display: false },
                        tooltip: {
                            callbacks: {
                                label: function(context) {
                                    let label = context.dataset.label || '';
                                    if (label) {
                                        label += ': ';
                                    }
                                    if (context.parsed.y !== null) {
                                        label += 'Rp ' + context.parsed.y.toLocaleString('id-ID');
                                    }
                                    return label;
                                }
                            }
                        }
                    },
                    scales: {
                        y: { 
                            beginAtZero: true,
                            ticks: {
                                callback: function(value, index, values) {
                                    return 'Rp ' + value.toLocaleString('id-ID');
                                }
                            }
                        }
                    }
                }
            });
        } catch(e) {
            console.error('Dashboard Chart Error:', e);
        }
    }

    const mutasiKasState = { currentPage: 1, itemsPerPage: 10 };

    function renderSaldoKas() {
        try {
            const elSaldo = document.getElementById('fin-saldo-kas');
            const elMasuk = document.getElementById('fin-uang-masuk');
            const elKeluar = document.getElementById('fin-uang-keluar');
            
            let saldo = 0;

            let totalKeluar = 0;
            
            const safeBukuKas = state.bukuKas || [];
            if (safeBukuKas.length > 0) {
                safeBukuKas.forEach(entry => {
                    const masuk = parseFloat(entry.Masuk_Debit) || 0;
                    const keluar = parseFloat(entry.Keluar_Kredit) || 0;
                    totalMasuk += masuk;
                    totalKeluar += keluar;
                });
                const lastEntry = safeBukuKas[safeBukuKas.length - 1];
                saldo = parseFloat(lastEntry.Saldo_Berjalan) || 0;
            }
            
            if (elSaldo) elSaldo.textContent = `Rp ${saldo.toLocaleString('id-ID')}`;
            if (elMasuk) elMasuk.textContent = `Rp ${totalMasuk.toLocaleString('id-ID')}`;

            // Also refresh individual bank balances
            refreshBankBalances();
        } catch(e) {
            console.error('Render Saldo Kas Error:', e);
        }

    function refreshBankBalances() {
        google.script.run
            .withSuccessHandler(balances => {
                ['BCA', 'BNI', 'BRI', 'MANDIRI'].forEach(bank => {
                    const el = document.getElementById('fin-saldo-' + bank);
                    if (el) {
                        el.textContent = `Rp ${(balances[bank] || 0).toLocaleString('id-ID')}`;
                    }
                });
            })
            .getBalancesPerBank();

    function renderMutasiKas() {
        try {
            const tbody = document.getElementById('tbody-mutasi-kas');
            if (!tbody) return;
            tbody.innerHTML = '';

            const safeData = state.bukuKas || [];
            // Reverse order (newest first)
            const reversedData = [...safeData].reverse();
            const totalRows = reversedData.length;
            const totalPages = Math.ceil(totalRows / mutasiKasState.itemsPerPage) || 1;
            if (mutasiKasState.currentPage > totalPages) mutasiKasState.currentPage = totalPages;

            const startIdx = (mutasiKasState.currentPage - 1) * mutasiKasState.itemsPerPage;
            const endIdx = startIdx + mutasiKasState.itemsPerPage;
            const slicedData = reversedData.slice(startIdx, endIdx);

            if (slicedData.length === 0) {
                tbody.innerHTML = '<tr><td colspan="7" class="px-4 py-6 text-center text-slate-400">Belum ada mutasi kas</td></tr>';
            } else {
                slicedData.forEach(entry => {
                    const masuk = parseFloat(entry.Masuk_Debit) || 0;
                    const keluar = parseFloat(entry.Keluar_Kredit) || 0;
                    const saldo = parseFloat(entry.Saldo_Berjalan) || 0;

                    let tipeBadge = '';
                    if (entry.Tipe_Transaksi === 'Modal') {
                        tipeBadge = '<span class="px-2 py-0.5 bg-blue-100 dark:bg-blue-900/30 text-blue-700 dark:text-blue-400 rounded text-xs font-medium">Modal</span>';
                    } else if (entry.Tipe_Transaksi === 'Pencairan Penjualan') {
                        tipeBadge = '<span class="px-2 py-0.5 bg-emerald-100 dark:bg-emerald-900/30 text-emerald-700 dark:text-emerald-400 rounded text-xs font-medium">Pencairan</span>';
                    } else {
                        tipeBadge = '<span class="px-2 py-0.5 bg-red-100 dark:bg-red-900/30 text-red-700 dark:text-red-400 rounded text-xs font-medium">Pengeluaran</span>';
                    }

                    tbody.innerHTML += `
                        <tr>
                            <td class="px-4 py-3">${entry.Tanggal}</td>
                            <td class="px-4 py-3">${tipeBadge}</td>
                            <td class="px-4 py-3"><span class="px-2 py-0.5 bg-slate-100 dark:bg-slate-700 text-slate-700 dark:text-slate-300 rounded text-xs font-medium">${entry.Rekening || '-'}</span></td>
                            <td class="px-4 py-3 text-slate-600 dark:text-slate-300">${entry.Keterangan || '-'}</td>
                            <td class="px-4 py-3 text-right font-medium ${masuk > 0 ? 'text-emerald-600 dark:text-emerald-400' : 'text-slate-400'}">${masuk > 0 ? 'Rp ' + masuk.toLocaleString('id-ID') : '-'}</td>
                            <td class="px-4 py-3 text-right font-medium ${keluar > 0 ? 'text-red-600 dark:text-red-400' : 'text-slate-400'}">${keluar > 0 ? 'Rp ' + keluar.toLocaleString('id-ID') : '-'}</td>
                            <td class="px-4 py-3 text-right font-bold text-slate-900 dark:text-slate-100">Rp ${saldo.toLocaleString('id-ID')}</td>
                        </tr>
                    `;
                });
            }

            // Pagination
            const displayStart = totalRows === 0 ? 0 : startIdx + 1;
            const displayEnd = Math.min(endIdx, totalRows);
            const paginationContainer = document.getElementById('pagination-mutasi-kas');
            if (paginationContainer) {
                paginationContainer.innerHTML = `
                    <span>Menampilkan ${displayStart}-${displayEnd} dari ${totalRows} baris</span>
                    <div class="inline-flex rounded-lg border border-slate-200 dark:border-slate-700">
                        <button onclick="changePageMutasiKas(-1)" ${mutasiKasState.currentPage === 1 ? 'disabled' : ''} class="px-3 py-1.5 text-sm font-medium text-slate-600 dark:text-slate-300 hover:bg-slate-50 dark:hover:bg-slate-700 border-r border-slate-200 dark:border-slate-700 transition-colors rounded-l-lg disabled:opacity-50">Previous</button>
                        <button disabled class="px-3 py-1.5 text-sm font-medium text-slate-900 dark:text-slate-100 bg-slate-50 dark:bg-slate-800/50">${mutasiKasState.currentPage}</button>
                        <button onclick="changePageMutasiKas(1)" ${mutasiKasState.currentPage === totalPages ? 'disabled' : ''} class="px-3 py-1.5 text-sm font-medium text-slate-600 dark:text-slate-300 hover:bg-slate-50 dark:hover:bg-slate-700 border-l border-slate-200 dark:border-slate-700 transition-colors rounded-r-lg disabled:opacity-50">Next</button>
                    </div>
                `;
            }
            lucide.createIcons();
        } catch (e) {
            console.error('Render Mutasi Kas Error:', e);
        }
    }

    function changePageMutasiKas(delta) {
        mutasiKasState.currentPage += delta;
        renderMutasiKas();
    }

    // --- RETUR LOGIC ---
    let currentReturDetails = [];
    function cariInvoiceRetur() {
        const noInvoice = document.getElementById('ret_no_invoice').value.trim();
        if(!noInvoice) return;
        
        const btn = document.getElementById('btnCariRetur'); // Assuming id btnCariRetur exists
        if(btn) {
            btn.disabled = true;
            btn.innerText = '...';
        }
        
        google.script.run
            .withFailureHandler(err => {
                if(btn) {
                    btn.disabled = false;
                    btn.innerText = 'Cari';
                }
                Swal.fire('Error', 'Gagal mencari invoice: ' + err.message, 'error');
            })
            .withSuccessHandler(details => {
                if(btn) {
                    btn.disabled = false;
                    btn.innerText = 'Cari';
                }
                
                const safeDetails = details || [];
                if(safeDetails.length > 0) {
                    currentReturDetails = safeDetails;
                    const selectProduk = document.getElementById('ret_produk');
                    selectProduk.disabled = false;
                    selectProduk.innerHTML = '<option value="">-- Pilih Produk --</option>';
                    
                    const safeProduk = state.produk || [];
                    safeDetails.forEach(d => {
                        const p = safeProduk.find(x => x.ID_Produk === d.ID_Produk);
                        const nama = p ? p.Nama_Produk : d.ID_Produk;
                        selectProduk.innerHTML += `<option value="${d.ID_Produk}">${nama} (Terjual: ${d.Qty})</option>`;
                    });
                    
                    document.getElementById('ret_qty').disabled = false;
                    document.getElementById('ret_kondisi').disabled = false;
                    document.getElementById('ret_kerugian').disabled = false;
                    document.getElementById('btnSaveRetur').disabled = false;
                    
                    // CHECK STATUS DANA
                    const safeInvoices = state.invoices || [];
                    const originalInv = safeInvoices.find(inv => inv.No_Invoice === noInvoice);
                    if(originalInv && originalInv.Status_Dana === 'Sudah') {
                        document.getElementById('ret_warning_dana').classList.remove('hidden');
                        const targetGroup = document.getElementById('ret_target_group');
                        targetGroup.classList.remove('hidden');
                        const targetSelect = document.getElementById('ret_target_invoice');
                        targetSelect.disabled = false;
                        targetSelect.innerHTML = '<option value="">-- Pilih Invoice Pending --</option>';
                        
                        const pendingInvoices = safeInvoices.filter(i => i.Status_Dana === 'Belum');
                        pendingInvoices.forEach(i => {
                            targetSelect.innerHTML += `<option value="${i.No_Invoice}">${i.No_Invoice} (${i.Marketplace} - ${i.Nama_Toko})</option>`;
                        });
                    } else {
                        document.getElementById('ret_warning_dana').classList.add('hidden');
                        document.getElementById('ret_target_group').classList.add('hidden');
                        document.getElementById('ret_target_invoice').disabled = true;
                    }
                } else {
                    Swal.fire('Perhatian', 'Invoice tidak ditemukan atau tidak memiliki detail produk.', 'warning');
                    document.getElementById('formRetur').reset();
                    disableReturForm();
                }
            }).getInvoiceDetails(noInvoice);
    }

        e.preventDefault();
        
        const qty = parseInt(document.getElementById('ret_qty').value);
        const maxQty = parseInt(document.getElementById('ret_qty').max);
        
        if(qty > maxQty) {
            Swal.fire('Peringatan', 'Qty retur melebihi qty yang dibeli!', 'warning');

        }
        
        const btn = document.getElementById('btnSaveRetur');
        btn.disabled = true;
        btn.innerHTML = '<i data-lucide="loader-2" class="w-5 h-5 animate-spin"></i> Memproses...';

        let targetInvoice = document.getElementById('ret_no_invoice').value;
        const safeInvoices = state.invoices || [];
        const originalInv = safeInvoices.find(inv => inv.No_Invoice === targetInvoice);
        if(originalInv && originalInv.Status_Dana === 'Sudah') {
            targetInvoice = document.getElementById('ret_target_invoice').value;
            if(!targetInvoice) {
                Swal.fire('Peringatan', 'Pilih invoice target potongan karena invoice asli sudah cair!', 'warning');

                btn.innerHTML = 'Proses Retur';

            ID_Produk: document.getElementById('ret_produk').value,

        google.script.run

                btn.innerHTML = 'Proses Retur';

                document.getElementById('formRetur').reset();
                disableReturForm();
                loadInitialData();
                btn.disabled = false;

    function changePageRetur(delta) {
        const safeData = state.retur || [];
        const totalPages = Math.ceil(safeData.length / returState.itemsPerPage) || 1;
        returState.currentPage += delta;
        if (returState.currentPage < 1) returState.currentPage = 1;
        if (returState.currentPage > totalPages) returState.currentPage = totalPages;
        renderRetur();
    }

    function renderRetur() {
        try {
            const tbody = document.getElementById('tbody-retur');
            if(!tbody) return;
            tbody.innerHTML = '';
            
            const safeData = state.retur || [];
            const startIdx = (returState.currentPage - 1) * returState.itemsPerPage;
            const endIdx = startIdx + returState.itemsPerPage;
            const slicedData = safeData.slice(startIdx, endIdx);

            if(slicedData.length === 0) {
                tbody.innerHTML = '<tr><td colspan="9" class="px-4 py-6 text-center text-slate-400">Belum ada data retur</td></tr>';
            } else {
                slicedData.forEach(r => {
                    const p = (state.produk || []).find(x => x.ID_Produk === r.ID_Produk);
                    const nama = p ? p.Nama_Produk : r.ID_Produk;
                    const badgeClass = r.Kondisi === 'Bagus' ? 'bg-emerald-100 text-emerald-700' : 'bg-red-100 text-red-700';
                    tbody.innerHTML += `
                        <tr>
                            <td class="px-4 py-3">${r.Tanggal}</td>
                            <td class="px-4 py-3">${r.ID_Retur}</td>
                            <td class="px-4 py-3">${r.No_Invoice_Asli}</td>
                            <td class="px-4 py-3 font-medium">${nama}</td>
                            <td class="px-4 py-3">${r.Qty}</td>
                            <td class="px-4 py-3"><span class="px-2.5 py-1 rounded-lg text-xs font-medium ${badgeClass}">${r.Kondisi}</span></td>
                            <td class="px-4 py-3">${r.Beban_Dipotong_Dari_Invoice_No || r.No_Invoice_Asli}</td>
                            <td class="px-4 py-3 text-red-600">Rp ${(parseFloat(r.Kerugian_Manual) || 0).toLocaleString('id-ID')}</td>
                            <td class="px-4 py-3">
                                <div class="flex gap-1">
                                    <button class="p-1.5 text-blue-600 hover:bg-blue-50 dark:hover:bg-blue-900/20 rounded-lg transition-colors" onclick="editRecord('${r.ID_Retur}', 'retur')">
                                        <i data-lucide="pencil" class="w-4 h-4"></i>
                                    </button>
                                    <button class="p-1.5 text-red-600 hover:bg-red-50 dark:hover:bg-red-900/20 rounded-lg transition-colors" onclick="deleteRecord('${r.ID_Retur}', 'retur')">
                                        <i data-lucide="trash-2" class="w-4 h-4"></i>
                                    </button>
                                </div>
                            </td>
                        </tr>
                    `;
                });
            }

            // Update Pagination Controls
            const totalRows = safeData.length;
            const totalPages = Math.ceil(totalRows / returState.itemsPerPage) || 1;
            const displayStart = totalRows === 0 ? 0 : startIdx + 1;
            const displayEnd = Math.min(endIdx, totalRows);
            
            const paginationContainer = document.getElementById('pagination-retur');
            if(paginationContainer) {
                paginationContainer.innerHTML = `
                    <span>Menampilkan ${displayStart}-${displayEnd} dari ${totalRows} baris</span>
                    <div class="inline-flex rounded-lg border border-slate-200 dark:border-slate-700">
                        <button onclick="changePageRetur(-1)" ${returState.currentPage === 1 ? 'disabled' : ''} class="px-3 py-1.5 text-sm font-medium text-slate-600 dark:text-slate-300 hover:bg-slate-50 dark:hover:bg-slate-700 border-r border-slate-200 dark:border-slate-700 transition-colors rounded-l-lg disabled:opacity-50">Previous</button>
                        <button disabled class="px-3 py-1.5 text-sm font-medium text-slate-900 dark:text-slate-100 bg-slate-50 dark:bg-slate-800/50">${returState.currentPage}</button>
                        <button onclick="changePageRetur(1)" ${returState.currentPage === totalPages ? 'disabled' : ''} class="px-3 py-1.5 text-sm font-medium text-slate-600 dark:text-slate-300 hover:bg-slate-50 dark:hover:bg-slate-700 border-l border-slate-200 dark:border-slate-700 transition-colors rounded-r-lg disabled:opacity-50">Next</button>
                    </div>
                `;
            }
        } catch(e) {
            console.error('Render Retur Error:', e);
        }
    }

    // --- GLOBAL TAB LOGIC ---
    function switchTab(tabId, groupName) {
        // 1. Hide all contents in this group
        const contents = document.querySelectorAll('.tab-content-' + groupName);
        contents.forEach(el => el.classList.add('hidden'));
        
        // 2. Deactivate all buttons in this group
        const buttons = document.querySelectorAll('.tab-btn-' + groupName);
        buttons.forEach(el => {
            el.classList.remove('border-indigo-600', 'text-indigo-600');
            el.classList.add('border-transparent', 'text-slate-500');
        });
        
        // 3. Show target content
        const target = document.getElementById(tabId);
        if (target) target.classList.remove('hidden');
        
        // 4. Activate clicked button
        const clickedBtn = document.querySelector(`[data-tab="${tabId}"]`);
        if (clickedBtn) {
            clickedBtn.classList.remove('border-transparent', 'text-slate-500');
            clickedBtn.classList.add('border-indigo-600', 'text-indigo-600');
        }
        
        // Re-init Lucide icons if any in the newly shown tab
        if(typeof lucide !== 'undefined') lucide.createIcons();
    }

    function calculateInvoice() {
        let totalOmset = 0;
        let feeOngkir = 0;
        let feePromo = 0;

        const marketplace = document.getElementById('inv_marketplace').value;
        const namaToko = document.getElementById('inv_toko').value;
        
        let tokoConfig = null;
        if (marketplace && marketplace !== 'Offline' && namaToko && state.toko) {
            tokoConfig = state.toko.find(t => t.Marketplace === marketplace && t.Nama_Toko === namaToko);
        }

        invoiceItems.forEach(item => {
            const subtotal = item.Qty * item.Harga_Jual_Aktual;
            totalOmset += subtotal;
            
            if (tokoConfig) {
                let baseOngkirItem = item.Harga_Jual_Aktual * (parseFloat(tokoConfig.Fee_GratisOngkir_Pct) || 0);
                let actualOngkirItem = Math.min(baseOngkirItem, parseFloat(tokoConfig.Max_GratisOngkir) || 0);
                feeOngkir += (actualOngkirItem * item.Qty);
                
                let basePromoItem = item.Harga_Jual_Aktual * (parseFloat(tokoConfig.Fee_Promo_Pct) || 0);
                let actualPromoItem = Math.min(basePromoItem, parseFloat(tokoConfig.Max_Promo) || 0);
                feePromo += (actualPromoItem * item.Qty);
            }
        });
        
        document.getElementById('inv_summary_omset').textContent = `Rp ${totalOmset.toLocaleString('id-ID')}`;
        
        let feeAdmin = 0;
        const feesContainer = document.getElementById('inv_online_fees_container');
        
        if (tokoConfig) {
            feesContainer.classList.remove('hidden');
            
            let feeEcom = totalOmset * (parseFloat(tokoConfig.Fee_Ecommerce_Pct) || 0);
            
            document.getElementById('inv_summary_fee_ecommerce').textContent = `- Rp ${feeEcom.toLocaleString('id-ID')}`;
            document.getElementById('inv_summary_fee_ongkir').textContent = `- Rp ${feeOngkir.toLocaleString('id-ID')}`;
            document.getElementById('inv_summary_fee_promo_extra').textContent = `- Rp ${feePromo.toLocaleString('id-ID')}`;
            
            feeAdmin = feeEcom + feeOngkir + feePromo;
        } else {
            feesContainer.classList.add('hidden');
        }
        
        const jumlahResi = parseFloat(document.getElementById('inv_jumlah_resi').value) || 0;
        const tarifResiSetting = state.settings && state.settings['Tarif_Pelayanan_Per_Resi'] ? state.settings['Tarif_Pelayanan_Per_Resi'] : {nilai: 1250, tipe: 'Nominal'};
        const biayaPelayanan = jumlahResi * parseFloat(tarifResiSetting.nilai);
        document.getElementById('inv_biaya_pelayanan').value = biayaPelayanan;
        
        const biayaLain = parseFloat(document.getElementById('inv_biaya_lain').value) || 0;
        
        const penerimaanBersih = totalOmset - feeAdmin - biayaPelayanan - biayaLain;
        document.getElementById('inv_summary_laba').textContent = `Rp ${penerimaanBersih.toLocaleString('id-ID')}`;
        
        return { totalOmset, feeAdmin, biayaPelayanan, biayaLain };
    }

    function saveInvoice(e) {
        e.preventDefault();
        
        if(invoiceItems.length === 0) {
            Swal.fire('Keranjang Kosong', 'Tambahkan minimal 1 produk!', 'warning');
            return;
        }
        
        const invalidItem = invoiceItems.find(x => !x.ID_Produk);
        if(invalidItem) {
            Swal.fire('Data Tidak Lengkap', 'Pastikan semua baris pesanan telah memilih produk!', 'warning');
            return;
        }

        const btn = document.getElementById('btnSaveInvoice');
        btn.disabled = true;
        btn.innerHTML = '<i data-lucide="loader-2" class="w-5 h-5 animate-spin"></i> Memproses...';
        lucide.createIcons();
        
        const calc = calculateInvoice();
        
        const invoiceData = {
            header: {
                Tanggal: document.getElementById('inv_tanggal').value,
                Shift: document.getElementById('inv_shift').value,
                Tipe: document.getElementById('inv_marketplace').value === 'Offline' ? 'Offline' : 'Online',
                Marketplace: document.getElementById('inv_marketplace').value,
                Nama_Toko: document.getElementById('inv_toko').value,
                Total_Fee_Admin: calc.feeAdmin,
                Biaya_Pelayanan: calc.biayaPelayanan,
                Biaya_Lain: calc.biayaLain
            },
            details: invoiceItems
        };

        const saveProcess = () => {
            showLoading(true);
            google.script.run
                .withFailureHandler((err) => {
                    showLoading(false);
                    btn.disabled = false;
                    btn.innerHTML = '<i data-lucide="check-circle" class="w-5 h-5"></i> Proses Transaksi';
                    lucide.createIcons();
                    Swal.fire('Terjadi Kesalahan', err.message, 'error');
                })
                .withSuccessHandler((noInvoice) => {
                    showLoading(false);
                    Swal.fire({
                        title: 'Berhasil!',
                        text: 'Transaksi Berhasil Disimpan: ' + noInvoice,
                        icon: 'success',
                        confirmButtonColor: '#0f172a'
                    }).then(() => {
                        window.editingNoInvoice = null;
                        loadInitialData();
                        document.getElementById('formInvoice').reset();
                        invoiceItems = [];
                        renderInvoiceItems();
                        calculateInvoice();
                        
                        btn.disabled = false;
                        btn.innerHTML = '<i data-lucide="check-circle" class="w-5 h-5"></i> Proses Transaksi';
                        lucide.createIcons();
                    });
                }).saveInvoice(invoiceData);
        };

        if (window.editingNoInvoice) {
            Swal.fire({
                title: 'Update Transaksi?',
                text: 'Data lama akan diganti dengan data baru ini.',
                icon: 'question',
                showCancelButton: true,
                confirmButtonColor: '#0f172a',
                cancelButtonColor: '#f1f5f9',
                confirmButtonText: 'Ya, Update',
                cancelButtonText: 'Batal'
            }).then((result) => {
                if (result.isConfirmed) {
                    showLoading(true);
                    google.script.run
                        .withFailureHandler(err => {
                            showLoading(false);
                            Swal.fire('Gagal!', 'Gagal menghapus data lama: ' + err, 'error');
                        })
                        .withSuccessHandler(() => {
                            saveProcess();
                        }).deleteInvoice(window.editingNoInvoice);
                }
            });
        } else {
            saveProcess();
        }
    }

    function applyHistoryFilter() {
        const safeInvoices = state.invoices || [];
        const safeDetails = state.invoiceDetails || [];
        const safeProduk = state.produk || [];
        
        const start = document.getElementById('hist_filter_start').value;
        const end = document.getElementById('hist_filter_end').value;
        const query = (document.getElementById('hist_filter_search').value || '').toLowerCase().trim();
        
        let filteredInvoices = safeInvoices.filter(inv => {
            let matchDate = true;
            if (start && inv.Tanggal < start) matchDate = false;
            if (end && inv.Tanggal > end) matchDate = false;
            
            let matchQuery = true;
            if (query) {
                const text = `${inv.No_Invoice} ${inv.Marketplace} ${inv.Nama_Toko}`.toLowerCase();
                matchQuery = text.includes(query);
            }
            
            return matchDate && matchQuery;
        });
        
        // Sorting Tab 1
        filteredInvoices.sort((a, b) => {
            let valA = a[historyState.sortCol] || '';
            let valB = b[historyState.sortCol] || '';
            
            if (historyState.sortCol === 'Total_Omset' || historyState.sortCol === 'Laba_Bersih') {
                valA = parseFloat(valA) || 0;
                valB = parseFloat(valB) || 0;
            }
            
            if (valA < valB) return historyState.sortAsc ? -1 : 1;
            if (valA > valB) return historyState.sortAsc ? 1 : -1;
            return 0;
        });
        
        historyState.filtered = filteredInvoices;
        historyState.currentPage = 1;
        
        updateHistorySummaryCards();
        renderHistory();

        // --- Tab 2: Detail Item Penjualan ---
        let flatDetails = [];
        safeInvoices.forEach(inv => {
            let matchDate = true;
            if (start && inv.Tanggal < start) matchDate = false;
            if (end && inv.Tanggal > end) matchDate = false;
            if (!matchDate) return;

            const items = safeDetails.filter(d => d.No_Invoice === inv.No_Invoice);
            items.forEach(item => {
                const produk = safeProduk.find(p => p.ID_Produk === item.ID_Produk);
                const namaProduk = produk ? produk.Nama_Produk : '';
                
                let matchQuery = true;
                if (query) {
                    const text = `${inv.No_Invoice} ${inv.Marketplace} ${inv.Nama_Toko} ${item.ID_Produk} ${namaProduk}`.toLowerCase();
                    matchQuery = text.includes(query);
                }
                
                if (matchQuery) {
                    flatDetails.push({
                        ...item,
                        Tanggal: inv.Tanggal,
                        Marketplace: inv.Marketplace,
                        Nama_Toko: inv.Nama_Toko,
                        Nama_Produk: namaProduk
                    });
                }
            });
        });

        // Sorting Tab 2
        flatDetails.sort((a, b) => {
            let valA = a[historyDetailState.sortCol] || '';
            let valB = b[historyDetailState.sortCol] || '';
            
            if (historyDetailState.sortCol === 'Harga_Jual_Aktual' || historyDetailState.sortCol === 'Qty') {
                valA = parseFloat(valA) || 0;
                valB = parseFloat(valB) || 0;
            }
            
            if (valA < valB) return historyDetailState.sortAsc ? -1 : 1;
            if (valA > valB) return historyDetailState.sortAsc ? 1 : -1;
            return 0;
        });

        historyDetailState.filtered = flatDetails;
        historyDetailState.currentPage = 1;
        renderHistoryDetail();
    }

    function openEditSalesModal(invoiceId) {
        currentEditInvoiceId = invoiceId;
        const header = state.invoices.find(h => h.No_Invoice === invoiceId);
        if(!header) {
            Swal.fire('Error', 'Invoice tidak ditemukan dalam state lokal.', 'error');
            return;
        }

        // Fill modal fields
        document.getElementById('edit_inv_no_invoice').value = invoiceId;
        document.getElementById('edit_inv_no_invoice_display').textContent = invoiceId;
        document.getElementById('edit_inv_tanggal').value = header.Tanggal;
        document.getElementById('edit_inv_marketplace').value = header.Marketplace;
        
        // Setup Toko Dropdown
        const selectToko = document.getElementById('edit_inv_toko');
        selectToko.disabled = false;
        selectToko.innerHTML = '<option value="">-- Pilih Toko --</option>';
        state.toko.filter(t => t.Marketplace === header.Marketplace).forEach(t => {
            selectToko.innerHTML += `<option value="${t.Nama_Toko}">${t.Nama_Toko}</option>`;
        });
        selectToko.value = header.Nama_Toko;
        
        document.getElementById('edit_inv_shift').value = header.Shift || '09:00';
        document.getElementById('edit_inv_biaya_lain').value = header.Biaya_Lain || 0;
        
        // Fee calculation depends on Resi Qty
        // We can estimate Resi Qty from Biaya Pelayanan if not stored directly
        // Assuming Biaya Pelayanan = resiCount * 1250 (from setupDatabase line 59)
        const resiCount = Math.round((parseFloat(header.Biaya_Pelayanan) || 0) / 1250);
        document.getElementById('edit_inv_jumlah_resi').value = resiCount;
        document.getElementById('edit_inv_biaya_pelayanan').value = header.Biaya_Pelayanan;

        // Fetch details from state
        editInvoiceCart = state.invoiceDetails.filter(d => d.No_Invoice === invoiceId).map(d => ({
            ID_Produk: d.ID_Produk,
            Qty: d.Qty,
            Harga_Jual_Aktual: d.Harga_Jual_Aktual
        }));

        renderEditInvoiceCart();
        calculateEditInvoice();

        const modal = new bootstrap.Modal(document.getElementById('modalEditInvoice'));
        modal.show();
    }

    function updateEditInvoiceItem(index, field, value) {
        if(field === 'ID_Produk') {
            editInvoiceCart[index].ID_Produk = value;
            const p = state.produk.find(x => x.ID_Produk === value);
            if(p) {
                editInvoiceCart[index].Harga_Jual_Aktual = p.Harga_Jual_Default;
            } else {
                editInvoiceCart[index].Harga_Jual_Aktual = 0;
            }
        } else if (field === 'Qty') {
            editInvoiceCart[index].Qty = parseInt(value) || 0;
        } else if (field === 'Harga_Jual_Aktual') {
            editInvoiceCart[index].Harga_Jual_Aktual = parseFloat(value) || 0;
        }
        
        renderEditInvoiceCart();
        calculateEditInvoice();
    }

    function renderEditInvoiceCart() {
        const tbody = document.getElementById('edit-invoice-items');
        if(!tbody) return;
        tbody.innerHTML = '';
